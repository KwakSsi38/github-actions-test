name: Backend CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Quality Gate and Test
          # 위에서 에러 났던 명령어들을 하나로 합치고 env를 추가했습니다.
        run: ./gradlew checkstyleMain spotbugsMain test jacocoTestReport jacocoTestCoverageVerification
        env:
          DB_URL: jdbc:h2:mem:testdb;MODE=PostgreSQL
          DB_USERNAME: sa
          DB_PASSWORD: ""
          CUSTOM_JWT_SECRET_KEY: "start-ai-hub-default-secret-key-for-testing-purposes-only"

      - name: Publish Unit Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: '**/build/test-results/test/**/*.xml'
          check_name: '테스트 결과 보고서 📊'
          comment_mode: 'always'

# 사후 부석용
      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/

