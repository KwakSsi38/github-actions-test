name: AI Model Data Pipeline

on:
  schedule:
    - cron: "0 0 * * *"   # 매일 오전 9시 KST (00:00 UTC)
  workflow_dispatch:
    inputs:
      start_from:
        description: "재실행 시작 단계"
        required: false
        default: "fetch_or_models"
        type: choice
        options:
          - fetch_or_models
          - fetch_aa_benchmark
          - upload_to_oci
          - webhook_trigger

env:
  PYTHON_VERSION: "3.11"
  SCRIPTS_PATH:   "collectors/scripts/ai_info"

jobs:
  pipeline:
    name: Run AI Model Data Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 환경 세팅 ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r ${{ env.SCRIPTS_PATH }}/requirements.txt

      - name: Create package init files
        run: |
          touch collectors/__init__.py
          touch collectors/scripts/__init__.py
          touch collectors/scripts/shared/__init__.py
          touch collectors/scripts/ai_info/__init__.py

      - name: Write OCI config
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_CONFIG }}" > ~/.oci/config
          echo "${{ secrets.OCI_KEY }}"    > ~/.oci/key.pem
          chmod 600 ~/.oci/config ~/.oci/key.pem

      # ── 파이프라인 실행 ──────────────────────────────────────────────────
      - name: "1. Fetch OpenRouter Models"
        if: |
          github.event_name == 'schedule' ||
          contains(fromJSON('["fetch_or_models"]'), github.event.inputs.start_from)
        run: python -m collectors.scripts.ai_info.fetch_or_models

      - name: "2. Fetch Artificial Analysis Benchmark"
        if: |
          github.event_name == 'schedule' ||
          contains(fromJSON('["fetch_or_models","fetch_aa_benchmark"]'), github.event.inputs.start_from)
        env:
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
        run: python -m collectors.scripts.ai_info.fetch_aa_benchmark

      - name: "3. Upload Raw Data to OCI"
        env:
          OCI_NAMESPACE:       ${{ secrets.OCI_NAMESPACE }}
          OCI_BUCKET:          ${{ secrets.OCI_BUCKET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m collectors.scripts.ai_info.upload_to_oci

      - name: "4. Trigger Spring Pipeline"
        if: |
          github.event_name == 'schedule' ||
          contains(fromJSON('["fetch_or_models","fetch_aa_benchmark","upload_to_oci","webhook_trigger"]'), github.event.inputs.start_from)
        env:
          SPRING_WEBHOOK_URL:    ${{ secrets.SPRING_WEBHOOK_URL }}
          SPRING_WEBHOOK_SECRET: ${{ secrets.SPRING_WEBHOOK_SECRET }}
        run: python -m collectors.scripts.ai_info.webhook_trigger

      # ── 정리 ─────────────────────────────────────────────────────────────
      - name: Cleanup OCI credentials
        if: always()
        run: rm -f ~/.oci/config ~/.oci/key.pem

      # ── 실패 알림 ─────────────────────────────────────────────────────────
      - name: Notify on failure (Discord)
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -c "
          from collectors.scripts.ai_info.notify import notify_failure
          run_url = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          notify_failure('pipeline', Exception(f'워크플로우 실패: {run_url}'))
          "