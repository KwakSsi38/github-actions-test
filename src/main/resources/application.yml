server:
  forward-headers-strategy: native

spring:
  application:
    name: start-ai-hub
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:start_ai_hub;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
  jackson:
    time-zone: Asia/Seoul
  servlet:
    multipart:
      enabled: true
      max-file-size: 1MB
      max-request-size: 5MB

app:
  storage:
    type: ${APP_STORAGE_TYPE:local}
    local:
      upload-dir: ${APP_STORAGE_LOCAL_UPLOAD_DIR:./uploads}
    oci:
      bucket: ${OCI_OBJECT_STORAGE_BUCKET:}
      namespace: ${OCI_OBJECT_STORAGE_NAMESPACE:}
      prefix: ${OCI_OBJECT_STORAGE_PREFIX:prod/}

custom:
  jwt:
    secret-key: ${CUSTOM_JWT_SECRET_KEY:start-ai-hub-default-secret-key-start-ai-hub-default}
    access-token-expiration-seconds: ${CUSTOM_JWT_ACCESS_EXPIRATION_SECONDS:1800}
    refresh-token-expiration-seconds: ${CUSTOM_JWT_REFRESH_EXPIRATION_SECONDS:1209600}
  cors:
    allowed-origin-patterns:
      - http://localhost:3000
  swagger:
    enabled: false

logging:
  level:
    back: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
